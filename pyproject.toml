[project]
name = "SchemaRAG"
version = "0.1.7"
description = "Build database schema for RAG in Dify dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dify-plugin",
    "sqlalchemy",
    "pymysql",
    "psycopg2-binary",
    "httpx",
    "dify-client",
    "pandas>=2.3.1",
    "tabulate>=0.9.0",
    # 额外的数据库驱动
    "pymssql",
    "oracledb",
    "pytest>=8.4.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    # 达梦数据库驱动 (仅 Linux/Windows)
    'dmpython>=2.5.22; sys_platform != "darwin"',
    'dmsqlalchemy>=2.0.0; sys_platform != "darwin"',
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools", "service", "core", "provider"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

# 默认使用清华 PyPI 镜像（uv sync / uv lock）；与 pip 的 --index-url 等价源
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true